# Codemagic: build an installable Android APK from the Expo project.
# Native folders are generated on the build machine (expo prebuild), never committed.
workflows:
  android-apk:
    name: Android APK
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22
      java: 17
      vars:
        # Publishable values only (safe to ship in the app). Never put service_role keys here.
        EXPO_PUBLIC_SUPABASE_URL: https://uhrekbhunrrouqjrrsqa.supabase.co
        EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_DW_wTKjp-JpKr8u02ntzlg_8HVFNBrS
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Generate Android project
        script: CI=1 npx expo prebuild --platform android --clean
      - name: Point Gradle at the Android SDK
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Build release APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
